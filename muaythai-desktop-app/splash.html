<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Vipers Fight Team</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            background: linear-gradient(145deg, #141414, #1a1a1a);
            color: #fff;
            font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            -webkit-app-region: drag; /* permite arrastar a janela mesmo sem barra de título */
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            overflow: hidden;
        }
        .logo { width: 84px; height: 84px; margin-bottom: 20px; border-radius: 50%; }
        h1 { font-size: 1.1rem; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 4px; }
        h1 span { color: #e60000; }
        #status { font-size: 0.85rem; color: #9a9a9a; margin-top: 18px; }
        .spinner {
            margin-top: 22px;
            width: 26px; height: 26px;
            border: 3px solid #2a2a2a;
            border-top-color: #e60000;
            border-radius: 50%;
            animation: girar 0.8s linear infinite;
        }
        @keyframes girar { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <img class="logo" src="logo.png" alt="Vipers Fight Team" onerror="this.style.display='none'">
    <h1>VIPERS <span>FIGHT TEAM</span></h1>
    <div class="spinner"></div>
    <div id="status">Iniciando...</div>
</body>
</html>
